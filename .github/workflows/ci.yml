name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gate:local
      - run: npm run audit:all

  electron-smoke:
    name: Electron smoke (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Build unpacked macOS app
        if: runner.os == 'macOS'
        run: npm run pack:dir:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build unpacked Windows app
        if: runner.os == 'Windows'
        run: npm run pack:win
      - name: Packaged Agent SDK protocol smoke
        run: npm run test:packaged:sdk
      - name: Package size budget
        run: npm run test:package-budget
      - name: Windows NSIS install and uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/packaged/windows-install-smoke.ps1
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
